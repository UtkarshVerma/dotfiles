# source = ./variables.conf

# Monitors --------------------------------------------------------------------
monitorrule = name:^eDP-1$,scale:1.25

# Autostart -------------------------------------------------------------------
exec-once = /usr/libexec/pam_kwallet_init
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = musicup
# exec-once = hypridle
exec-once = rswal --variables no-reload=1
exec-once = wl-paste --type text --watch cliphist store  # Store only text
exec-once = wl-paste --type image --watch cliphist store # Store only images
# exec-once = breaks
exec-once = nm-applet

# Effects ---------------------------------------------------------------------
animations=0
blur = 1
shadows = 0
border_radius=0

# Appearance ------------------------------------------------------------------
gappih = 5
gappiv = 5
gappoh = 20
gappov = 20
# gappih = {{ $gap_inner / 2 }}
# gappiv = {{ $gap_inner / 2 }}
# gappoh = {{ $gap_outer }}
# gappov = {{ $gap_outer }}
borderpx = 1
# rootcolor=$background
# bordercolor=$background
# focuscolor=$color4
maximizescreencolor=0x89aa61ff
# urgentcolor=$color1
# scratchpadcolor=0x516c93ff
# globalcolor=0xb153a7ff
# overlaycolor=0x14a57cff
cursor_size = $XCURSOR_SIZE
cursor_theme = vimix

# Layouts ---------------------------------------------------------------------
## Scroller
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

## Master stack
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# Input -----------------------------------------------------------------------
## Keyboard
xkb_rules_options = caps:escape

## Trackpad
## need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

## Mouse
# need relogin to make it apply
mouse_natural_scrolling=0

## TODO: cursor inactive timeout.

# Rules ----------------------------------------------------------------------
## Default to tile layout for all tags.
tagrule = id:1, layout_name:tile
tagrule = id:2, layout_name:tile
tagrule = id:3, layout_name:tile
tagrule = id:4, layout_name:tile
tagrule = id:5, layout_name:tile
tagrule = id:6, layout_name:tile
tagrule = id:7, layout_name:tile
tagrule = id:8, layout_name:tile
tagrule = id:9, layout_name:tile

## Launch applications in certain workspaces.
windowrule = appid:Brave-browser, tags:1
windowrule = appid:discord, tags:9
windowrule = appid:Element, tags:5

windowrule = appid:scratchterm, isnamedscratchpad:1, isfloating:1
#TODO: buggy

## TODO: Disable borders for workspaces with only one client.

# Keymaps ----------------------------------------------------------------
bind = Super+Shift, c, reload_config
bind = Super+Shift, q, killclient,

# Applications
bind = Super, Return, spawn, terminal
bind = Super, Escape, spawn, sysact
bind = Super, d, spawn, j4-dmenu-desktop --no-generic -d 'menu -i'
bind = Super+Ctrl, d, spawn, menu-run
bind = Super, e, spawn, terminal -e $FILE_MANAGER
bind = Super+Shift, e, spawn, terminal -e $SYSTEM_MONITOR
bind = Super, w, spawn, $BROWSER
bind = Super, t, spawn, timers
bind = Super, p, spawn, sysprofile
bind = Super, Slash, spawn, emoji-menu
bind = Super+Shift, Slash, spawn, emoji-menu -c
bind = Super, c, spawn, rofi-calc
bind = Super, s, spawn, snip sel file
bind = Super+Shift, s, spawn, snip sel clip # TODO: Better tools?
bind = Super+Ctrl, s, spawn, flameshot gui # TODO: Better tools?
bind = Super+Shift, r, spawn, screenrecord
bind = Super, m, spawn, mountmate
bind = Super+Shift, m, spawn, mountmate -u
bind = Super, F4, spawn, terminal -e wiremix

bind = Super, Grave, toggle_named_scratchpad, scratchterm, none, terminal -n scratchterm

## Multimedia
bind = Super+Ctrl, Down, spawn,  brightnessctl -q set 5%-
bind = Super+Ctrl, Up, spawn,  brightnessctl -q set +5%
bind = Super+Ctrl, l, spawn, musicctl next
bind = Super+Ctrl, j, spawn, musicctl previous
bind = Super+Ctrl, k, spawn, musicctl toggle
bind = Super+Ctrl+Shift, k, spawn, musicctl stop
bind = None, XF86TouchpadToggle, spawn, toggle-touchpad
bind = None, XF86MonBrightnessDown, spawn,  brightnessctl -q set 5%-
bind = None, XF86MonBrightnessUp, spawn,  brightnessctl -q set +5%
bind = None, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioRaiseVolume, spawn, wpctl set-volume --limit=1.0 @DEFAULT_AUDIO_SINK@ 3%+; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioLowerVolume, spawn, wpctl set-volume --limit=1.0 @DEFAULT_AUDIO_SINK@ 3%-; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioMicMute, spawn, toggle-mic
bind = None, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioRaiseVolume, spawn, wpctl set-volume --limit=1.0 @DEFAULT_AUDIO_SINK@ 3%+; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioLowerVolume, spawn, wpctl set-volume --limit=1.0 @DEFAULT_AUDIO_SINK@ 3%-; pkill -RTMIN+8 $STATUSBAR
bind = None, XF86AudioMicMute, spawn, toggle-mic
bind = None, XF86AudioPlay, spawn, musicctl toggle
bind = None, XF86AudioNext, spawn, musicctl next
bind = None, XF86AudioPrev, spawn, playerctl previous
bind = None, XF86AudioStop, spawn, playerctl stop

## Window focus and movement.
bind = Super, Space, zoom,
bind = Super, k, focusstack, prev
bind = Super, j, focusstack, next
bind = Super+Shift, k, exchange_stack_client, prev
bind = Super+Shift, j, exchange_stack_client, next

## Switch window status.
bind = ALT,Tab,toggleoverview,
bind = Super+Shift, Space,togglefloating,
bind = Super, f, togglefullscreen,
bind = Super+Shift, f, togglefakefullscreen,
bind = Super, o, toggleoverlay,
bind = Super, i, minimized,
bind = Super+Shift, i, restore_minimized
bind=ALT,z,toggle_scratchpad

## Layout
bind = Super, n, switch_layout
bind = Super, h, setmfact, -0.03
bind = Super, l, setmfact, +0.03
bind = Super, i, incnmaster, +1
bind = Super+Shift, i, incnmaster, -1

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

## Tags
bind = Super, 1, view, 1, 0
bind = Super, 2, view, 2, 0
bind = Super, 3, view, 3, 0
bind = Super, 4, view, 4, 0
bind = Super, 5, view, 5, 0
bind = Super, 6, view, 6, 0
bind = Super, 7, view, 7, 0
bind = Super, 8, view, 8, 0
bind = Super, 9, view, 9, 0
bind = Super, BracketLeft, viewtoleft_have_client, 0
bind = Super, BracketRight, viewtoright_have_client, 0
bind = Super, Tab, view, -1

bind = Super+Shift, 1, tagsilent, 1, 0
bind = Super+Shift, 2, tagsilent, 2, 0
bind = Super+Shift, 3, tagsilent, 3, 0
bind = Super+Shift, 4, tagsilent, 4, 0
bind = Super+Shift, 5, tagsilent, 5, 0
bind = Super+Shift, 6, tagsilent, 6, 0
bind = Super+Shift, 7, tagsilent, 7, 0
bind = Super+Shift, 8, tagsilent, 8, 0
bind = Super+Shift, 9, tagsilent, 9, 0
bind = Super+Shift, BracketLeft, tagtoleft, 0    # TODO: This focuses the new window
bind = Super+Shift, BracketRight, tagtoright, 0  # TODO: This focuses the new window

## Monitors
bind = Super, comma, focusmon, left
bind = Super, period, focusmon, right
bind = Super+Shift, comma, tagmon, left
bind = Super+Shift, period, tagmon, right

## Gaps
bind = Super, a, togglegaps
bind = Super+Shift, X, incgaps, 1
bind = Super+Shift, Z, incgaps, -1

# movewin
bind = Super+CTRL, k, movewin, +0, -50
bind = Super+CTRL, j, movewin, +0, +50
bind = Super+CTRL, h, movewin, -50, +0
bind = Super+CTRL, l, movewin, +50, +0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=Super,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=Super,btn_right,moveresize,curresize


# Axis Bindings
axisbind=Super,UP,viewtoleft_have_client
axisbind=Super,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
